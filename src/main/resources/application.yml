server:
  port: 8080

spring:
  application:
    name: escena-peru-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/musicaperuana_db
    username: postgres
    password: admin123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

logging:
  level:
    com.escenaperu: debug

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-valor-en-produccion-minimo-32-caracteres}
    access-token-minutes: 15
    refresh-token-days: 7
    issuer: escena-peru
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

debug: true