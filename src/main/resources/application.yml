server:
  port: ${PORT:8080}

spring:
  application:
    name: escena-peru-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

logging:
  level:
    com.escenaperu: INFO
    org.springframework: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
    issuer: escena-peru

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

debug: false